# Deploys the landing page to Cloudflare Pages on every push to main
# that touches landing-page/.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   - API token with "Cloudflare Pages: Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  - Cloudflare dashboard -> Workers & Pages -> Account ID
name: Deploy landing page to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "landing-page/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROJECT_NAME: kitabi-in
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble deploy directory
        run: |
          mkdir -p public
          # book.html / author.html / publisher.html are deliberately absent:
          # those were the client-rendered shells, replaced by server-rendered
          # Pages Functions. Everything the public site serves now comes from
          # ./functions except these static assets and the legal pages.
          cp landing-page/index.html landing-page/404.html landing-page/privacy.html landing-page/terms.html landing-page/logo.svg landing-page/kitabi-logo.png landing-page/ico.png landing-page/apple-touch-icon.png landing-page/og-image.png landing-page/robots.txt landing-page/sitemap.xml public/
          cp landing-page/_redirects landing-page/_headers public/
          cp -R landing-page/.well-known public/.well-known
          # Self-hosted brand faces (fonts/README.md). Without these the pages
          # fall through to the system stack — which looks fine, so a missing
          # copy here would not be obvious.
          mkdir -p public/fonts && cp landing-page/fonts/*.woff2 public/fonts/
          # Pages Functions (the whole server-rendered site) must sit in
          # ./functions relative to the deploy command's cwd — wrangler compiles
          # it automatically alongside the static `public` assets.
          cp -R landing-page/functions functions
          # The renderer's own tests. Cheap, no dependencies, and they guard the
          # things that fail silently in production: escaping, the robots tag,
          # and never emitting a fabricated AggregateRating.
          python3 landing-page/tests/run.py

      - name: Deploy
        run: npx wrangler@4 pages deploy public --project-name="$PROJECT_NAME" --branch=main
