<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Kitabi Admin{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="icon" href="/static/logo.svg?v=2" type="image/svg+xml">
<link rel="stylesheet" href="/static/admin.css?v=5">
<script src="/static/admin.js?v=9" defer></script>
<!-- Installable PWA — the sign-in screen must carry these too, since it is the
     page an admin installs from (see base.html for the same block). -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F6F0E3">
<link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Kitabi Admin">
<meta name="application-name" content="Kitabi Admin">
</head>
<body>
{# Navigation loader — the sign-in flow is POST-and-redirect too, so the same
   feedback applies here (see base.html for the full note). #}
<div class="navload" id="navload" role="status" aria-live="polite" aria-hidden="true">
  <div class="navload-in">
    <img class="navload-mark" src="/static/logo.svg?v=2" alt="" width="70" height="70">
    <div class="navload-bar"><span></span></div>
  </div>
  <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Loading…</span>
</div>
<div class="auth-wrap">
  <div class="auth">
    <img class="m2" src="/static/logo.svg" alt="Kitabi">
    {% if flash %}<div class="flash {{ flash.kind }}" style="margin-bottom:16px">{{ flash.text }}</div>{% endif %}
    {% block content %}{% endblock %}
  </div>
</div>
</body>
</html>
